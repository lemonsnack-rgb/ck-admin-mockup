<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>기본 적용 정책 설정 · CK 관리기</title>
<link rel="stylesheet" href="styles.css" />
</head>
<body data-active="ck-default">
<div class="layout">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="main">
    <div class="topbar">
      <div class="topbar-row">
        <button class="panel-toggle" data-panel-toggle title="사이드바 접기"></button>
        <nav class="breadcrumb"><span>CK 관리기</span><span class="sep">›</span><span>기능별 이용 제한 정책 관리</span><span class="sep">›</span><span class="cur">기본 적용 정책 설정</span></nav>
      </div>
    </div>
    <div class="content">
      <div class="card"><div class="card-body">
        <h1 class="page-title">기본 적용 정책 설정</h1>
        <p class="page-sub">도메인과 무관하게 해당 서비스에 공통 적용되는 기본 정책입니다. 개별(도메인별) 정책이 없으면 이 값이 자동 적용됩니다.</p>

        <!-- 서비스 목록: 번호 / 서비스명 / 기본 사용여부 / 기본 일일한도 (기본 이용기간은 항상 무기한 → 표시 안 함) -->
        <div class="table-wrap">
          <table class="tbl">
            <thead>
              <tr>
                <th style="width:64px">번호</th>
                <th class="left">서비스명</th>
                <th>기본 사용여부</th>
                <th>기본 일일한도</th>
                <th></th>
              </tr>
            </thead>
            <tbody id="rows"></tbody>
          </table>
        </div>
        <p class="mt-note">※ 서비스가 추가되면 이 목록에 행이 하나 추가됩니다. 서비스별 공통 기본 정책을 여기서 등록하고, 특정 도메인만 다르게 하려면 <b>도메인별 정책 설정</b>에서 지정합니다.</p>
      </div></div>
    </div>
  </div>
</div>

<script src="app.js"></script>
<script>
  function useBadge(u){ return u==='Y'?'<span class="badge">사용</span>':'<span class="badge unused">미사용</span>'; }
  // [번호, 서비스명, 기본사용여부, 기본일일한도] — 기본 이용기간은 항상 무기한(고정)이므로 컬럼으로 표시하지 않음
  const svcs=[
    ['1','참고문헌 유효성 검증','Y','3'],
  ];
  document.getElementById('rows').innerHTML = svcs.map(s=>`
    <tr>
      <td class="muted">${s[0]}</td>
      <td class="left"><b style="font-weight:600">${s[1]}</b></td>
      <td>${useBadge(s[2])}</td>
      <td class="num ${s[3]==='—'?'muted':''}">${s[3]}</td>
      <td><button class="btn btn-outline sm" onclick="openEdit('${s[1]}')">수정</button></td>
    </tr>`).join('');

  // 수정 = 별도 페이지로 이동(모달 아님, 다른 메뉴와 통일)
  function openEdit(name){ location.href='ck-feature-edit.html?svc='+encodeURIComponent(name); }
</script>
</body>
</html>
